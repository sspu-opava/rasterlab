[package]
name = "rasterlab"
version = "0.10.0"
description = "Nondestructive experimental raster editor"
authors = ["RasterLab"]
edition = "2021"

[lib]
name = "rasterlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
